<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GCode SVG Viewer</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #111827;
        color: #d5dae0;
        font-family: "Space Grotesk", "DM Sans", "Verdana", sans-serif;
        overflow: hidden;
      }
      #root { position: relative; }
      .controls {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(12, 16, 20, 0.88);
        border: 1px solid rgba(120, 140, 160, 0.3);
        font-size: 12px;
        letter-spacing: 0.06em;
        flex-wrap: wrap;
      }
      .file-btn {
        display: inline-flex;
        align-items: center;
        cursor: pointer;
        color: #9fd7ff;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
        user-select: none;
      }
      .file-btn:hover { color: #cceeff; }
      .ctrl-btn {
        background: rgba(255, 255, 255, 0.08);
        color: #d5dae0;
        border: 1px solid rgba(120, 140, 160, 0.3);
        border-radius: 8px;
        padding: 5px 10px;
        font: inherit;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .ctrl-btn:hover { background: rgba(255, 255, 255, 0.14); }
      .hint-text {
        font-size: 10px;
        color: #6a7480;
        letter-spacing: 0.04em;
        width: 100%;
        margin-top: 4px;
      }
      .filename {
        font-size: 11px;
        color: #aab4be;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .legend {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .legend-rapid::before {
        content: "";
        display: inline-block;
        width: 18px;
        height: 3px;
        background: #4a9eff;
        border-radius: 2px;
        margin-right: 5px;
        vertical-align: middle;
      }
      .legend-cut::before {
        content: "";
        display: inline-block;
        width: 18px;
        height: 3px;
        background: #e05c00;
        border-radius: 2px;
        margin-right: 5px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./svg-viewer.bundle.js"></script>
  </body>
</html>
