name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Guard against self-dependency
        run: |
          node -e '
            const pkg = require("./package.json");
            const name = pkg.name;
            const deps = { ...pkg.dependencies, ...pkg.devDependencies };
            if (name in deps) {
              console.error(`package.json lists itself (${name}) as a dependency`);
              process.exit(1);
            }
          '

      - run: npm ci

      - run: npm run build

      - run: npm test

      - run: npm pack --dry-run
